<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS - Animations</title>
    <style>
      .container {
        width: 50vw;
        height: 50vh;
        background-color: purple;
       
      }

      .box {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        width: 150px;
        height: 150px;
        background-image: url("borderImg.jpg");

        /* combined
        animation: name duration timing-function delay iteration-count direction fill-mode; */
        animation: animation2 3s cubic-bezier(0.83, 0.08, 0, 1.14) infinite 1s alternate-reverse;

        /* animation-name: animation2;
        animation-duration: 3s;
        animation-timing-function: cubic-bezier(0.83, 0.08, 0, 1.14);
        animation-iteration-count: infinite;
        animation-delay: 1s;
        animation-direction: alternate-reverse;  */
        /* writing down the upper method in short line */

        /* animation-play-state: paused; */

        /* check the animation refrence by clicking link below */
        /* https://developer.mozilla.org/en-US/docs/Web/CSS/animation-direction */


        /* animation: animation 3s ease-in-out 1s infinite; */ 
        /* animation: animation 3s ease-in-out 1 forwards;  */
        /* animation: animation 3s ease-in-out infinite alternate-reverse,
                   animation2 3s ease-in-out infinite alternate-reverse; */
      }
      /* @keyframes animation {
        from{

            background-color: yellow;
        }
        to{
            background-color: aqua;


        }
      } */

      @keyframes animation2 {
        0%{
          background-color: yellow;
          color: red;
          background-image: url("borderImg.jpg");
          background-size: cover;


        }
        50% {
            transform: translateX(10vw) translateY(10vw) rotate(60deg);
            background-color: aqua;
            color: yellow;
            background-image: url(heroImg.jpg);
            background-size: cover;
            background-position: center;

        }
        100%{
            transform: translateX(20vw) translateY(20vw) rotate(360deg);
            background-color: yellow;
            color: red;
            background-image: url(koenigsegg.jpg);
            background-size: cover;


        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
